{% extends "base.html" %}

{% block title %}サーバーエラー - 放課後ポスト{% endblock %}

{% block content %}
<div class="empty-state card" style="padding: 60px 24px; text-align: center;">
    <div class="empty-state-icon" style="font-size: 5rem;">⚠️</div>
    <h1 class="empty-state-title" style="font-size: 2rem; margin-bottom: 16px;">500</h1>
    <h2 class="empty-state-title" style="font-size: 1.25rem; font-weight: 500; margin-bottom: 16px;">サーバーエラーが発生しました</h2>
    <p class="empty-state-text" style="max-width: 400px; margin: 0 auto 24px;">
        一時的なエラーが発生しました。<br>
        しばらく時間をおいてから再度お試しください。
    </p>
    <a href="{{ url_for('index') }}" class="btn btn--primary btn--block" style="max-width: 280px;">トップページに戻る</a>
</div>
{% endblock %}
